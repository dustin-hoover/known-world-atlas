# Builds the atlas and publishes site/ to GitHub Pages on every push to main.
name: Publish to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - name: Release gate (tools/known/gate.py; any FAIL stops the release)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet numpy shapely scipy pillow scikit-image playwright
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python tools/known/gate.py
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
