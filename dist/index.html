<style>:root {
  /* Layout: full-bleed planet. Instruments float: search + rail top-left, working panel left,
     place dossier right, Shire-calendar timeline along the bottom edge. One committed dark look. */
  --ink: #0a0d12;
  --panel: rgba(15, 19, 26, 0.9);
  --panel-solid: #12171f;
  --raise: rgba(255, 244, 214, 0.05);
  --rule: rgba(222, 204, 160, 0.15);
  --fg: #ece6d6;
  --muted: #9e978a;
  --faint: #6f6a61;
  --gold: #d9ac52;
  --gold-dim: rgba(217, 172, 82, 0.18);
  --ithil: #8ec5d6;
  --ember: #df6a4c;
  --leaf: #9cc47a;
  --font-display: 'IM Fell English', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --font-sc: 'IM Fell English SC', 'IM Fell English', Georgia, serif;
  --font-ui: 'Alegreya Sans', 'Gill Sans', 'Segoe UI', system-ui, sans-serif;
  --font-data: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r: 10px;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.45), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--fg); font: 15px/1.45 var(--font-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#map { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 60%, #0e1520 0%, #07090d 70%); }
#stars { position: fixed; inset: 0; pointer-events: none; }
.maplibregl-canvas { outline: none; }

/* ---------- loader ---------- */
#loader { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #121a24 0%, #07090c 75%); transition: opacity 0.9s ease; }
#loader.gone { opacity: 0; pointer-events: none; }
#loader .inner { width: min(440px, calc(100vw - 48px)); text-align: center; }
#loader h1 { font: 400 clamp(40px, 9vw, 64px)/1 var(--font-sc); letter-spacing: 0.32em; margin: 0 0 6px; padding-left: 0.32em; color: var(--fg); }
#loader .sub { font: italic 17px/1.3 var(--font-display); color: var(--muted); margin-bottom: 28px; }
#loader .bar { height: 2px; background: var(--rule); overflow: hidden; border-radius: 2px; }
#loader .bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width 0.4s ease; }
#loader .step { margin-top: 12px; font: 12px/1.4 var(--font-data); color: var(--faint); letter-spacing: 0.04em; min-height: 1.4em; }
#loader .err { color: var(--ember); font-family: var(--font-ui); font-size: 14px; }

/* ---------- chrome ---------- */
.glass { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); }
#top { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; z-index: 10; display: flex; flex-direction: column; gap: 8px; width: 340px; max-width: calc(100vw - 24px); }
#brand { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px 8px; }
#brand b { font: 400 22px/1 var(--font-sc); letter-spacing: 0.28em; }
#brand span { font: italic 14px/1 var(--font-display); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#search { position: relative; }
#search input { width: 100%; box-sizing: border-box; padding: 11px 14px 11px 38px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
#search input::placeholder { color: var(--faint); }
#search svg { position: absolute; left: 12px; top: 12px; width: 17px; height: 17px; stroke: var(--muted); }
#results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; max-height: 50vh; overflow: auto; padding: 4px; display: none; }
#results.open { display: block; }
#results button { display: flex; width: 100%; gap: 10px; align-items: baseline; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 7px; }
#results button:hover, #results button.sel { background: var(--raise); }
#results .n { font: 16px/1.2 var(--font-display); }
#results .k { margin-left: auto; font: 11px var(--font-data); color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
#results .a { font: italic 13px var(--font-display); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#rail { position: fixed; left: 12px; top: calc(128px + env(safe-area-inset-top, 0px)); z-index: 10; display: flex; flex-direction: column; gap: 4px; padding: 5px; }
#rail button { width: 42px; height: 42px; display: grid; place-items: center; border: 0; background: none; border-radius: 8px; color: var(--muted); position: relative; }
#rail button:hover { background: var(--raise); color: var(--fg); }
#rail button.on { background: var(--gold-dim); color: var(--gold); }
#rail svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
#rail button[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); background: var(--panel-solid); border: 1px solid var(--rule); padding: 4px 9px; border-radius: 6px; font-size: 13px; white-space: nowrap; color: var(--fg); pointer-events: none; }

#panel { position: fixed; left: 70px; top: calc(128px + env(safe-area-inset-top, 0px)); z-index: 9; width: 330px; max-height: calc(100vh - 250px); overflow: auto; padding: 14px 16px 16px; display: none; }
#panel.open { display: block; }
.ph { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.ph h2 { font: 400 22px/1.1 var(--font-display); margin: 0; text-wrap: balance; }
.x { border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.x:hover { color: var(--fg); background: var(--raise); }
.eyebrow { font: 500 11px/1 var(--font-data); letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); margin: 16px 0 8px; }
.eyebrow:first-child { margin-top: 2px; }
.row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.row label { flex: 1; min-width: 0; cursor: pointer; display: flex; align-items: center; gap: 10px; }
.row small { color: var(--faint); font-size: 12px; }
.sw { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid rgba(255, 255, 255, 0.15); }
.tog { appearance: none; -webkit-appearance: none; width: 32px; height: 18px; border-radius: 10px; background: #2a2f38; position: relative; flex: none; cursor: pointer; transition: background 0.2s; margin: 0; }
.tog::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #cfc8b8; transition: transform 0.2s; }
.tog:checked { background: var(--gold); }
.tog:checked::after { transform: translateX(14px); background: #1a1408; }
.seg { display: flex; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--rule); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; padding: 6px 8px; border-radius: 6px; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--gold-dim); color: var(--gold); }
.note { font-size: 13px; color: var(--muted); line-height: 1.45; }
.btn { border: 1px solid var(--rule); background: rgba(255, 255, 255, 0.04); border-radius: 8px; padding: 8px 12px; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; }
.btn:hover { border-color: rgba(217, 172, 82, 0.5); }
.btn.primary { background: var(--gold); color: #1a1408; border-color: var(--gold); font-weight: 600; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.legend { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 6px 0 3px; }
.legend + .scale { display: flex; justify-content: space-between; font: 11px var(--font-data); color: var(--faint); }

/* ---------- dossier ---------- */
#card { position: fixed; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 10; width: 360px; max-height: calc(100vh - 200px); overflow: auto; padding: 18px 18px 16px; display: none; }
#card.open { display: block; }
#card .kind { font: 500 11px/1 var(--font-data); letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
#card h1 { font: 400 32px/1.05 var(--font-display); margin: 8px 0 2px; text-wrap: balance; }
#card .alt { font: italic 16px/1.3 var(--font-display); color: var(--muted); }
#card p { margin: 12px 0; line-height: 1.5; }
#card dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 14px 0; font-size: 14px; }
#card dt { color: var(--faint); }
#card dd { margin: 0; font-variant-numeric: tabular-nums; min-width: 0; }
#card .mono { font-family: var(--font-data); font-size: 12.5px; }
.wxnow { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: baseline; padding: 12px 14px; background: rgba(142, 197, 214, 0.07); border: 1px solid rgba(142, 197, 214, 0.18); border-radius: 8px; margin: 12px 0; }
.wxnow .big { font: 400 34px/1 var(--font-display); grid-row: span 2; }
.wxnow .sky { font-weight: 600; }
.wxnow .det { color: var(--muted); font-size: 13px; }
.fc { width: 100%; height: 110px; display: block; margin-top: 6px; }

/* ---------- timeline ---------- */
#timeline { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 10; width: min(780px, calc(100vw - 420px)); padding: 10px 16px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center; }
#play { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--rule); background: rgba(255, 255, 255, 0.05); display: grid; place-items: center; grid-row: span 2; }
#play svg { width: 16px; height: 16px; fill: var(--fg); }
#play:hover { border-color: var(--gold); }
#tdate { font: 400 20px/1.1 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tdate em { font-style: italic; color: var(--muted); font-size: 15px; }
#tmeta { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
#tmeta select { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--rule); border-radius: 6px; padding: 3px 6px; font-size: 13px; color: var(--muted); }
#tmeta select option { background: var(--panel-solid); }
#track { grid-column: 2 / 4; position: relative; height: 24px; }
#track input { position: absolute; inset: 0; width: 100%; margin: 0; background: none; -webkit-appearance: none; appearance: none; height: 24px; }
#track input::-webkit-slider-runnable-track { height: 3px; background: var(--rule); border-radius: 2px; }
#track input::-moz-range-track { height: 3px; background: var(--rule); border-radius: 2px; }
#track input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--gold); margin-top: -5.5px; box-shadow: 0 0 0 4px rgba(217, 172, 82, 0.2); }
#track input::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--gold); border: 0; }
#ticks { position: absolute; left: 7px; right: 7px; top: 0; height: 24px; pointer-events: none; }
#ticks i { position: absolute; top: 5px; width: 1px; height: 5px; background: var(--muted); opacity: 0.6; }
#ticker { grid-column: 1 / 4; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.3em; }
#ticker b { color: var(--fg); font-weight: 500; }

/* ---------- status + controls ---------- */
#status { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 9; font: 11.5px/1.5 var(--font-data); color: var(--muted); padding: 7px 10px; font-variant-numeric: tabular-nums; min-width: 230px; }
#status b { color: var(--fg); font-weight: 400; }
#ctrl { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 10; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
#cgrps { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; transition: transform .25s ease, opacity .2s ease, visibility 0s; }
#ctrl #ctog { display: none; }
/* the controls' box spans the docked groups' space too: only the controls themselves take taps */
#ctrl { pointer-events: none; }
#ctrl #ctog, #ctrl .grp { pointer-events: auto; }
#ctrl.docked #cgrps .grp { pointer-events: none; }
#ctog svg { transition: transform .25s ease; }
#ctrl .grp { display: flex; flex-direction: column; padding: 3px; gap: 2px; }
#ctrl button { width: 38px; height: 38px; border: 0; background: none; border-radius: 7px; display: grid; place-items: center; color: var(--muted); font: 600 12px var(--font-data); }
#ctrl button:hover { background: var(--raise); color: var(--fg); }
#ctrl button.on { color: var(--gold); }
#ctrl svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#compass svg { transition: transform 0.1s linear; }
.maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left { display: none; }

  const any = L.clouds || L.radar || L.temp || L.pressure || L.wind;
  if (!any) return;
  wxBusy = true; wxDirty = false;
  const t = S.t;
  callWorker(WXW, { type: 'wx', t, layers: { clouds: L.clouds, radar: L.radar, temp: L.temp, pressure: L.pressure }, lore: LORE }).then(r => {
    wxBusy = false; lastWX = r;
    for (const k of ['clouds', 'radar', 'temp']) if (r.layers[k]) { CV[k].getContext('2d').putImageData(new ImageData(r.layers[k], WXB.W, WXB.H), 0, 0); refreshCanvas('wx-' + k); }

      const x0 = (WXB.lon0 + 180) / 360 * 1024, x1 = (WXB.lon1 + 180) / 360 * 1024;
      const my = lat => (1 - merc(lat) / merc(85.05)) / 2 * 512;
      const grd = (a, b) => { const gr = g.createLinearGradient(a[0], a[1], b[0], b[1]); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,1)'); return gr; };

      g.fillStyle = grd([x1, 0], [x1 - pad, 0]); g.fillRect(x1 - pad, y0, pad, y1 - y0);
      g.fillStyle = grd([0, y0], [0, y0 + pad]); g.fillRect(x0, y0, x1 - x0, pad);

  const mtn = GEN.F[2];
  const inR = n => { const r = GEO.REALMS.TA3018.find(r => r.name === n); return r && inPoly(X, Y, r); };
  if (inR('Mordor') || inR('Dol Guldur') || inR('Isengard') || Math.hypot(X - 266, Y - 268) < 70) return 'mordor';
  if (['Lindon', 'Imladris', 'Lothlórien', 'Woodland Realm'].some(inR)) return 'elven';
  if (Math.hypot(X - 402, Y + 172) < 30 || inR('Erebor & Dale') || inR('Iron Hills') || mtn > 0.35) return 'dwarf';
  if (inR('The Shire') || inR('Buckland') || inR('Bree-land')) return 'shire';
  if (inR('Rohan')) return 'rohan';

    uniforms: { sunDir: { value: new THREE.Vector3(0, 1, 0) }, zen: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, cloud: { value: 0.3 }, cloudCol: { value: new THREE.Color(1, 1, 1) }, time: { value: 0 }, night: { value: 0 }, sunCol: { value: new THREE.Color(1, 0.9, 0.7) } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position,1.0); gl_Position = p.xyww; }`,
    fragmentShader: `uniform vec3 sunDir, zen, hor, cloudCol, sunCol; uniform float cloud, time, night; varying vec3 vDir;
      float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
      float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
      float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<6;i++){ s+=a*n(p); p=p*2.03+vec2(1.7,9.2); a*=0.5; } return s; }
      void main(){
        vec3 d = normalize(vDir);
        float y = d.y;
        vec3 col = mix(hor, zen, pow(clamp(y,0.0,1.0), 0.45));
        float s = max(dot(d, normalize(sunDir)), 0.0);
        col += sunCol * (pow(s, 900.0) * 30.0 + pow(s, 12.0) * 0.35) * (1.0 - night);
        if (night > 0.0 && y > 0.0) { vec2 sp = d.xz / (y + 0.2) * 220.0; float st = step(0.997, h(floor(sp))); col += vec3(st) * night * 0.9 * (1.0 - cloud); }
        if (y > 0.0) {
          vec2 uv = d.xz / (y + 0.12) * 0.9 + vec2(time * 0.004, time * 0.002);
          float c = fbm(uv * 2.2);
          float cov = smoothstep(1.02 - cloud * 0.95, 1.25 - cloud * 0.6, c + 0.35);
          vec3 cc = cloudCol * (0.8 + 0.35 * smoothstep(0.3, 0.9, c)) + sunCol * pow(s, 6.0) * 0.4 * (1.0 - night);
          col = mix(col, cc, cov * smoothstep(0.0, 0.18, y));

        gl_FragColor = vec4(col, 1.0);

        #include <colorspace_fragment>

  });
  G.sky = new THREE.Mesh(new THREE.SphereGeometry(240000, 32, 16), G.skyMat);
  G.sky.frustumCulled = false;
  G.scene.add(G.sky);
  // precipitation
  const N = 5000, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) { pos[i * 3] = (Math.random() - 0.5) * 120; pos[i * 3 + 1] = Math.random() * 60; pos[i * 3 + 2] = (Math.random() - 0.5) * 120; }
  const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  G.rain = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xdde6ee, size: 0.08, transparent: true, opacity: 0.6, depthWrite: false }));
  G.rain.frustumCulled = false; G.rain.visible = false;
  G.scene.add(G.rain);
  G.grassTime = { value: 0 };
  makeGrass();
  bindInput();
  addEventListener('resize', resize);
}

function resize() {
  if (!G.renderer) return;
  const w = innerWidth, h = innerHeight;
  G.renderer.setSize(w, h, false); G.camera.aspect = w / h; G.camera.updateProjectionMatrix();
}

/* ---------------- input ---------------- */
const keys = {};
function bindInput() {
  const cv = G.renderer.domElement;
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    G.yaw += (e.clientX - drag.x) * 0.0032; G.pitch -= (e.clientY - drag.y) * 0.0032;
    G.pitch = Math.max(-1.4, Math.min(1.45, G.pitch));
    drag = { x: e.clientX, y: e.clientY };
  });
  cv.addEventListener('pointerup', () => drag = null);
  cv.addEventListener('wheel', e => { G.camera.fov = Math.max(20, Math.min(90, G.camera.fov + e.deltaY * 0.03)); G.camera.updateProjectionMatrix(); e.preventDefault(); }, { passive: false });
  addEventListener('keydown', e => {
    if (!G.active) return;
    keys[e.key.toLowerCase()] = true;
    if (e.key === 'Escape') close();
    if (e.key.toLowerCase() === 't' && !G.hall) { G.t += 1 / 24; updateAtmos(true); }
    if (e.key === '[' || e.key === ']') setRate(e.key === ']' ? 1 : -1);
    if (['w', 'a', 's', 'd', ' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  document.querySelectorAll('#gpad button').forEach(b => {
    b.addEventListener('pointerdown', e => { keys[b.dataset.k] = true; e.preventDefault(); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => { keys[b.dataset.k] = false; }));
  });
  $('#gexit').onclick = close;
  document.querySelectorAll('#gclock button').forEach(b => b.onclick = () => setRate(+b.dataset.r));
}

/* ---------------- data ---------------- */
function heightFn(grid, n, half) {
  return (x, z) => {
    const u = (x + half) / (2 * half) * (n - 1), v = (z + half) / (2 * half) * (n - 1);
    if (u < 0 || v < 0 || u > n - 1 || v > n - 1) return null;
    const i = Math.min(n - 2, Math.floor(u)), j = Math.min(n - 2, Math.floor(v)), fx = u - i, fy = v - j;
    const k = j * n + i;
    return (grid[k] * (1 - fx) + grid[k + 1] * fx) * (1 - fy) + (grid[k + n] * (1 - fx) + grid[k + n + 1] * fx) * fy;
  };
}
function groundAt(x, z) {
  if (G.hall) return G.hall.floorAt(x, z, G.hallY) ?? G.hallY ?? 0;
  let h = G.nearH ? G.nearH(x - G.nearOff.x, z - G.nearOff.z) : null;
  if (h === null && G.farH) h = G.farH(x, z);
  return Math.max(h ?? 0, G.seaLevel);
}

function terrainMesh(heights, n, half, tex, opts) {
  const geo = new THREE.PlaneGeometry(2 * half, 2 * half, n - 1, n - 1);
  geo.rotateX(-Math.PI / 2);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    let y = Math.max(heights[i], opts.floor ?? -1e9);
    if (opts.curv) { const x = p.getX(i), z = p.getZ(i); y -= (x * x + z * z) / (2 * 6371000); }
    if (opts.hole) { const x = Math.abs(p.getX(i)), z = Math.abs(p.getZ(i)); if (x < opts.hole && z < opts.hole) y -= 60; }
    p.setY(i, y);
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.96, metalness: 0 });
  if (opts.detail) {
    mat.onBeforeCompile = sh => {
      sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP;').replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWP = (modelMatrix * vec4(transformed,1.0)).xyz;');
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
        varying vec3 vWP;
        float gh(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
        float gn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(gh(i),gh(i+vec2(1,0)),f.x), mix(gh(i+vec2(0,1)),gh(i+vec2(1,1)),f.x), f.y); }`)
        .replace('#include <map_fragment>', `#include <map_fragment>
        float dist = length(vWP.xz - cameraPosition.xz);
        float fade = 1.0 - smoothstep(40.0, 900.0, dist);
        float d1 = gn(vWP.xz * 0.9) * 0.55 + gn(vWP.xz * 3.7) * 0.3 + gn(vWP.xz * 13.0) * 0.15;
        float grass = gn(vec2(vWP.x * 9.0, vWP.z * 2.5)) * gn(vec2(vWP.x * 2.3, vWP.z * 11.0));
        diffuseColor.rgb *= mix(1.0, 0.72 + 0.56 * d1 + 0.12 * grass, fade);`);
    };
  }
  const m = new THREE.Mesh(geo, mat);
  m.receiveShadow = !!opts.shadow;
  return m;
}

function skirt(mesh, n, depth) {
  // hang a curtain from the patch edge so seams are hidden
  const p = mesh.geometry.attributes.position, pos = [], idx = [];
  const edge = [];
  for (let i = 0; i < n; i++) edge.push(i);
  for (let j = 1; j < n; j++) edge.push(j * n + n - 1);
  for (let i = n - 2; i >= 0; i--) edge.push((n - 1) * n + i);
  for (let j = n - 2; j >= 0; j--) edge.push(j * n);
  edge.forEach((k, e) => { pos.push(p.getX(k), p.getY(k), p.getZ(k), p.getX(k), p.getY(k) - depth, p.getZ(k)); if (e) { const a = (e - 1) * 2, b = e * 2; idx.push(a, a + 1, b, b, a + 1, b + 1); } });
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x5b5a44, roughness: 1, side: THREE.DoubleSide }));
}

async function textureFor(run, X, Y, half, size, strips) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const rows = size / strips;
  await Promise.all(Array.from({ length: strips }, (_, s) => run({ type: 'pt', X, Y, half, tex: size, r0: s * rows, r1: (s + 1) * rows, season: G.o && G.o.season ? G.o.season(G.t) : 0 }).then(r => { ctx.drawImage(r.bmp, 0, s * rows); r.bmp.close && r.bmp.close(); })));
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = G.renderer.capabilities.getMaxAnisotropy(); t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter;
  return { tex: t, canvas: cv };
}

/* ---------------- vegetation & buildings ---------------- */
function buildTrees(arr, hAt) {
  const group = new THREE.Group();
  const kinds = [[], [], [], [], []];
  for (let i = 0; i < arr.length; i += 4) kinds[arr[i + 2]].push([arr[i], arr[i + 1], arr[i + 3]]);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 1 });
  const crownMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95 });
  crownMat.onBeforeCompile = sh => {
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vLP;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvLP = position;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vLP;\nfloat lh(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,37.719)))*43758.5453); }')
      .replace('#include <map_fragment>', '#include <map_fragment>\nfloat lf = lh(floor(vLP * 2.2)); diffuseColor.rgb *= 0.72 + 0.5 * lf * (0.6 + 0.4 * smoothstep(-1.0, 3.0, vLP.y - 5.0));');
  };
  // orchard crowns: the same leaf shading plus apples, pears and plums dotted through the foliage
  const fruitMat = crownMat.clone();
  fruitMat.onBeforeCompile = sh => {
    crownMat.onBeforeCompile(sh);
    // after the per-tree tint, so the fruit keeps its own colour
    sh.fragmentShader = sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      #ifdef USE_COLOR
      if (lh(floor(vLP * 9.0) + 3.1) > 0.955) { float k = fract(vColor.g * 977.0); diffuseColor.rgb = k > 0.5 ? vec3(0.5, 0.06, 0.04) : k > 0.2 ? vec3(0.55, 0.52, 0.12) : vec3(0.26, 0.06, 0.2); }
      #endif`);
  };
  const blob = (rx, ry, cx, cy, cz, seed) => {
    const b = new THREE.IcosahedronGeometry(1, 2), p = b.attributes.position;
    for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), z = p.getZ(i); const n = 1 + 0.18 * Math.sin(x * 5.1 + seed) * Math.sin(y * 4.3 + seed * 2) * Math.sin(z * 4.7 - seed); p.setXYZ(i, x * rx * n + cx, y * ry * n + cy, z * rx * n + cz); }
    return b;
  };
  const cluster = (R, H, Y) => {
    const parts = [blob(R, H, 0, Y, 0, 1), blob(R * 0.7, H * 0.7, R * 0.55, Y - H * 0.25, R * 0.2, 2), blob(R * 0.65, H * 0.65, -R * 0.5, Y - H * 0.15, -R * 0.3, 3), blob(R * 0.6, H * 0.6, R * 0.1, Y + H * 0.45, -R * 0.35, 4)];
    const pos = [], nor = [], idx = []; let off = 0;
    for (const q of parts) { q.computeVertexNormals(); const qi = q.index ? q.index.array : null; pos.push(...q.attributes.position.array); nor.push(...q.attributes.normal.array); if (qi) for (const v of qi) idx.push(v + off); else for (let v = 0; v < q.attributes.position.count; v++) idx.push(v + off); off += q.attributes.position.count; }
    const out = new THREE.BufferGeometry(); out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3)); out.setIndex(idx);
    return out;
  };
  const specs = [
    { crown: () => cluster(3.2, 2.8, 7.4), trunk: new THREE.CylinderGeometry(0.22, 0.34, 6, 6).translate(0, 3, 0), col: [[0.2, 0.3, 0.12], [0.26, 0.34, 0.14], [0.34, 0.36, 0.14], [0.3, 0.28, 0.12]] },
    { crown: () => { const a = new THREE.ConeGeometry(2.6, 6, 9).translate(0, 5.5, 0), b = new THREE.ConeGeometry(2.0, 5.5, 9).translate(0, 8.6, 0), c = new THREE.ConeGeometry(1.3, 4.5, 9).translate(0, 11.6, 0); const pos = [], idx = []; let o = 0; for (const q of [a, b, c]) { const qq = q.toNonIndexed(); pos.push(...qq.attributes.position.array); o += qq.attributes.position.count; } const out = new THREE.BufferGeometry(); out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); out.computeVertexNormals(); return out; }, trunk: new THREE.CylinderGeometry(0.2, 0.3, 4, 5).translate(0, 2, 0), col: [[0.1, 0.18, 0.1], [0.13, 0.2, 0.12], [0.09, 0.15, 0.09]] },
    { crown: () => cluster(10, 8, 36), trunk: new THREE.CylinderGeometry(1.1, 1.7, 34, 8).translate(0, 17, 0), col: [[0.72, 0.58, 0.16], [0.8, 0.66, 0.2], [0.66, 0.55, 0.18]], trunkCol: 0xb8b8b0 },
    { crown: () => cluster(4.4, 3.8, 9.6), trunk: new THREE.CylinderGeometry(0.4, 0.6, 8, 6).translate(0, 4, 0), col: [[0.07, 0.12, 0.07], [0.09, 0.13, 0.08], [0.1, 0.11, 0.08]] },
    { crown: () => cluster(1.7, 1.4, 2.9), trunk: new THREE.CylinderGeometry(0.1, 0.16, 2.2, 5).translate(0, 1.1, 0), col: [[0.22, 0.36, 0.14], [0.26, 0.38, 0.15], [0.2, 0.33, 0.13]], fruit: 1 },
  ];
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s3 = new THREE.Vector3(), p3 = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0), c = new THREE.Color();
  kinds.forEach((list, k) => {
    if (!list.length) return;
    const sp = specs[k];
    const crowns = new THREE.InstancedMesh(sp.crown(), sp.fruit ? fruitMat : crownMat, list.length);
    const trunks = new THREE.InstancedMesh(sp.trunk, sp.trunkCol ? new THREE.MeshStandardMaterial({ color: sp.trunkCol, roughness: 0.8 }) : trunkMat, list.length);
    list.forEach(([x, nz, sc], i) => {
      const z = -nz;
      if (Math.hypot(x - (G.spawnX || 0), z - (G.spawnZ || 0)) < 5) sc = 0.0001;
      const y = hAt(x, z) - 0.3;
      q.setFromAxisAngle(up, (x * 13.7 + z * 7.1) % 6.28);
      s3.set(sc, sc * (0.85 + ((i * 7919) % 100) / 300), sc);
      p3.set(x, y, z);
      m4.compose(p3, q, s3);
      crowns.setMatrixAt(i, m4); trunks.setMatrixAt(i, m4);
      const cc = sp.col[i % sp.col.length];
      const v = 0.85 + ((i * 2654435761) % 1000) / 3300;
      c.setRGB(cc[0] * v, cc[1] * v, cc[2] * v, THREE.SRGBColorSpace);
      crowns.setColorAt(i, c);
    });
    crowns.castShadow = true; trunks.castShadow = true; crowns.receiveShadow = true;
    group.add(crowns, trunks);
  });
  return group;
}

const WALLC = { hobbit: [0.55, 0.62, 0.3], bree: [0.62, 0.55, 0.45], rohan: [0.5, 0.36, 0.22], gondor: [0.86, 0.84, 0.8], minastirith: [0.92, 0.91, 0.88], osgiliath: [0.66, 0.64, 0.6], elf: [0.86, 0.85, 0.8], lorien: [0.9, 0.9, 0.86], lake: [0.42, 0.32, 0.24], dale: [0.62, 0.56, 0.5], harad: [0.84, 0.76, 0.6], isengard: [0.2, 0.2, 0.22], mordor: [0.14, 0.13, 0.14], morgul: [0.58, 0.66, 0.62], east: [0.7, 0.6, 0.45], beorning: [0.45, 0.33, 0.2], dwarf: [0.5, 0.48, 0.44], dunland: [0.42, 0.34, 0.24], woodmen: [0.45, 0.33, 0.22], ruin: [0.62, 0.6, 0.56] };
function buildBuildings(B, X0, Y0, hAt) {
  const pos = [], col = [], idx = [];
  let vi = 0;
  const addQuad = (a, b, c2, d, cr) => { for (const v of [a, b, c2, d]) { pos.push(v[0], v[1], v[2]); col.push(cr[0], cr[1], cr[2]); } idx.push(vi, vi + 1, vi + 2, vi, vi + 2, vi + 3); vi += 4; };
  const addTri = (a, b, c2, cr) => { for (const v of [a, b, c2]) { pos.push(v[0], v[1], v[2]); col.push(cr[0], cr[1], cr[2]); } idx.push(vi, vi + 1, vi + 2); vi += 3; };
  const box = (cx, cz, w, d, ang, y0, h, wall, roof, gable, ruin) => {
    const ca = Math.cos(-ang), sa = Math.sin(-ang);
    const P = (lx, lz, y) => [cx + lx * ca - lz * sa, y, cz + lx * sa + lz * ca];
    const hw = w / 2, hd = d / 2, y1 = y0 + h;
    const shade = f => wall.map(v => v * f);
    addQuad(P(-hw, hd, y0), P(hw, hd, y0), P(hw, hd, y1), P(-hw, hd, y1), shade(0.95));
    addQuad(P(hw, -hd, y0), P(-hw, -hd, y0), P(-hw, -hd, y1), P(hw, -hd, y1), shade(0.8));
    addQuad(P(hw, hd, y0), P(hw, -hd, y0), P(hw, -hd, y1), P(hw, hd, y1), shade(0.88));
    addQuad(P(-hw, -hd, y0), P(-hw, hd, y0), P(-hw, hd, y1), P(-hw, -hd, y1), shade(0.84));
    if (ruin) return;
    if (gable) {
      const rh = Math.min(w, d) * 0.45, ov = 0.4;
      if (w >= d) {
        addQuad(P(-hw - ov, hd + ov, y1), P(hw + ov, hd + ov, y1), P(hw + ov, 0, y1 + rh), P(-hw - ov, 0, y1 + rh), roof);
        addQuad(P(hw + ov, -hd - ov, y1), P(-hw - ov, -hd - ov, y1), P(-hw - ov, 0, y1 + rh), P(hw + ov, 0, y1 + rh), roof.map(v => v * 0.8));
        addTri(P(hw, hd, y1), P(hw, -hd, y1), P(hw, 0, y1 + rh), shade(0.9)); addTri(P(-hw, -hd, y1), P(-hw, hd, y1), P(-hw, 0, y1 + rh), shade(0.9));
      } else {
        addQuad(P(hw + ov, hd + ov, y1), P(hw + ov, -hd - ov, y1), P(0, -hd - ov, y1 + rh), P(0, hd + ov, y1 + rh), roof);
        addQuad(P(-hw - ov, -hd - ov, y1), P(-hw - ov, hd + ov, y1), P(0, hd + ov, y1 + rh), P(0, -hd - ov, y1 + rh), roof.map(v => v * 0.8));
        addTri(P(-hw, hd, y1), P(hw, hd, y1), P(0, hd, y1 + rh), shade(0.9)); addTri(P(hw, -hd, y1), P(-hw, -hd, y1), P(0, -hd, y1 + rh), shade(0.9));
      }
    } else addQuad(P(-hw, hd, y1), P(hw, hd, y1), P(hw, -hd, y1), P(-hw, -hd, y1), roof);
  };
  const mound = (cx, cz, r, y0, door) => {
    const seg = 10, rings = 4, base = vi;
    for (let j = 0; j <= rings; j++) { const phi = j / rings * Math.PI / 2; for (let i = 0; i <= seg; i++) { const th = i / seg * Math.PI * 2; pos.push(cx + Math.cos(th) * Math.cos(phi) * r, y0 + Math.sin(phi) * r * 0.55, cz + Math.sin(th) * Math.cos(phi) * r); const g = 0.85 + 0.15 * Math.sin(phi); col.push(0.3 * g, 0.42 * g, 0.16 * g); } }
    for (let j = 0; j < rings; j++) for (let i = 0; i < seg; i++) { const a = base + j * (seg + 1) + i, b = a + seg + 1; idx.push(a, b, a + 1, a + 1, b, b + 1); }
    vi += (rings + 1) * (seg + 1);
    // round door facing south-ish
    const dc = door, dr = 0.9, dz = cz + r * 0.93, dy = y0 + 0.95, base2 = vi;
    pos.push(cx, dy, dz + 0.05); col.push(dc[0], dc[1], dc[2]);
    for (let i = 0; i <= 12; i++) { const a = i / 12 * Math.PI * 2; pos.push(cx + Math.cos(a) * dr, dy + Math.sin(a) * dr, dz + 0.05); col.push(dc[0], dc[1], dc[2]); }
    for (let i = 1; i <= 12; i++) idx.push(base2, base2 + i, base2 + i + 1);
    vi += 14;
  };
  for (const b of B.list) {
    if (b.culture === 'lorien' || b.culture === 'elf') continue;
    const x = (b.x - X0) * MI, z = -(b.y - Y0) * MI;
